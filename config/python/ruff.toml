line-length = 100
target-version = "py311"

[lint]
select = [
  "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "D", "DTZ", "E",
  "ERA", "F", "G", "I", "PGH", "PLC", "PLE", "PLW", "RET", "RUF", "S",
  "SIM", "T10", "UP",
]
ignore = [
  "ANN401",
  "D100",
  "D104",
  "D105",
  "D107",
  "D203",
  "D213",
  "S603",
  "S606",
  "S607",
]

[lint.flake8-annotations]
ignore-fully-untyped = true
mypy-init-return = true

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 6
max-returns = 6

[lint.per-file-ignores]
".vulture_whitelist.py" = ["B018", "F821"]
"tests/**/*" = ["ANN", "ARG", "D", "S101"]
