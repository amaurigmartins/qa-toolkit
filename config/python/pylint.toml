[tool.pylint.main]
persistent = false
jobs = 1
ignore-paths = ["^tests/"]

[tool.pylint.messages_control]
disable = "all"
enable = ["cyclic-import", "duplicate-code", "invalid-name"]

[tool.pylint.basic]
module-rgx = ".*"
good-names-rgxs = ["^visit_[A-Z][A-Za-z0-9_]*$"]

[tool.pylint.similarities]
min-similarity-lines = 5
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
