StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = ai-tells

[*.markdown]
BasedOnStyles = ai-tells

[*.py]
BasedOnStyles = ai-tells
View = PythonDocstrings
ai-tells.DoubleHyphen = NO
ai-tells.EmphaticCopula = NO
ai-tells.Metacommentary = NO
ai-tells.RhetoricalSelfAnswer = NO

[*.jl]
BasedOnStyles = ai-tells
View = JuliaDocstrings
ai-tells.EmphaticCopula = NO
ai-tells.Metacommentary = NO
ai-tells.RhetoricalSelfAnswer = NO
