extends: existence
message: "State the technical fact directly instead of using '%s'."
level: error
ignorecase: true
tokens:
  - '\bfor the purposes of this (?:analysis|discussion|document)\b'
  - '\bit (?:is|should be) (?:important|essential) to (?:emphasize|note|distinguish)\b'
  - '\bit is worth noting\b'
  - '\bthe literature clearly demonstrates\b'
  - '\ba nuanced interpretation is required\b'
  - '\bnot only\b.+\bbut also\b'
  - '\bnot merely\b.+\bbut\b'
  - '\bthe following section (?:discusses|examines|describes)\b'
  - '\bthe preceding discussion (?:shows|demonstrates)\b'
  - '\bthe next subsection (?:discusses|examines|describes)\b'
  - '\boften overlooked\b'
  - '\bfrequently conflated\b'
  - '\bcommonly misunderstood\b'
  - '\bpolicy[- ]driven evaluation\b'
  - '\bgame[- ]changing\b'
  - '\bbest[- ]in[- ]class\b'
  - '\bseamless(?:ly)?\b'
  - '\bin order to\b'
  - '\bin order for\b'
  - '\b(?:is|are|was|were) able to\b'
  - '\b(?:has|have|had) the ability to\b'
  - '\bmake use of\b'
  - '\bin a safe manner\b'
  - '\bat this point in time\b'
  - '\bdue to the fact that\b'
  - '\bfor the reason that\b'
  - '\bwith regard to\b'
  - '\bin the event that\b'
  - '\ba large number of\b'
  - '\bthe most recent (?:release|version)\b'
