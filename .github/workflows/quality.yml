name: qa-toolkit quality

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-toolkit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ordinary quality and Julia 1.10.11 / 1.12.6
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository-owned QAT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct repository-owned tools
        run: ./bootstrap.sh

      - name: Enrol this checkout
        run: ./bin/qat repo enroll .

      - name: Verify local deployment
        run: |
          ./bin/qat tool status
          ./bin/qat repo status .
          ./bin/qat hook status .

      - name: Validate new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          if test -n "$BASE_SHA" && test "$BASE_SHA" != "0000000000000000000000000000000000000000"; then
            ./bin/qat commits --target . --range "$BASE_SHA..HEAD"
          fi

      - name: Run local Sentinel once
        run: ./bin/qat sentinel --target .

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-toolkit-evidence-${{ github.run_attempt }}
          path: .git/qat/evidence
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
