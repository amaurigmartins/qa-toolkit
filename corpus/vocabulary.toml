[settings]
locale = "en-GB"

[prose]
accepted = [
  "API", "ASCII", "CLI", "Codex", "CSV", "Documenter", "DSL", "Git", "GitHub", "HTTP",
  "HTTPS", "JSON", "Julia", "LaTeX", "Linux", "Markdown", "pgTAP", "POSIX", "Python",
  "Ruff", "SQL", "SSH", "TOML", "TTY", "UUID", "Vale", "XML", "YAML", "argparse",
  "frozenset", "shutil", "spelunking", "subparser", "subparsers", "tomllib", "weakref",
]
hedges = [
  "arguably", "generally", "in many cases", "it may be", "often", "perhaps", "potentially",
  "typically",
]
fillers = [
  "in order to", "it is important to note", "it is worth noting", "needless to say",
  "the fact that",
]

[identifiers]
accepted = ["api", "cli", "config", "id", "io", "json", "sql", "toml", "url", "uuid"]

[roles]
action = [
  "add", "apply", "build", "check", "collect", "create", "delete", "detect", "execute", "export",
  "fetch", "find", "format", "generate", "get", "install", "list", "load", "parse", "read",
  "remove", "render", "replace", "resolve", "run", "select", "sync", "update", "validate",
  "verify", "write",
]
outcome = [
  "adds", "blocks", "builds", "creates", "detects", "fails", "finds", "loads", "preserves",
  "rejects", "removes", "reports", "resolves", "returns", "runs", "updates", "validates", "writes",
]
concept = [
  "argument", "command", "configuration", "consumer", "corpus", "dependency", "digest", "evidence",
  "file", "finding", "gate", "hook", "identifier", "input", "message", "output", "path", "profile",
  "repository", "result", "rule", "runtime", "source", "target", "term", "tool", "version",
]
plural_concept = [
  "arguments", "commands", "configurations", "consumers", "dependencies", "files", "findings",
  "gates", "hooks", "identifiers", "inputs", "outputs", "paths", "profiles", "repositories",
  "results", "rules", "sources", "terms", "tools", "versions",
]
context = [
  "central", "consumer", "documentation", "file", "full", "git", "julia", "local", "markdown",
  "python", "repository", "runtime", "source", "target", "tool",
]
condition = ["accepted", "active", "available", "current", "enabled", "missing", "selected", "tracked"]
qualifier = ["advisory", "blocking", "exact", "explicit", "local", "managed", "native", "shared"]

[acronyms]
accepted = [
  "API", "ASCII", "CAUTION", "CLI", "CPU", "CSV", "DANGER", "DSL", "EOF", "GPU", "HTTP",
  "HTTPS", "IDE", "IMPORTANT", "IO", "JSON", "KPI", "MIME", "NOTE", "POSIX", "RAM", "README",
  "REST", "RFC", "SQL", "SSH", "STE", "SVG", "TCP", "TOML", "TTY", "UDP", "UI", "URI",
  "URL", "UTC", "UTF", "UUID", "WARNING", "XDG", "XML", "YAML",
]

[sources]
license_names = ["COPYING", "LICENSE", "NOTICE"]
license_families = ["Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "GPL-3.0", "MIT"]
generated_patterns = [
  "**/Manifest.toml", "**/package-lock.json", "**/uv.lock", "**/generated/**", "**/vendor/**",
]
gitlab_cache_keys = ["files", "files_commits", "prefix"]

[documents]
suffixes = [".jl", ".markdown", ".md", ".py", ".tex"]
documenter_directives = ["@autodocs", "@contents", "@docs", "@example", "@index", "@meta", "@raw", "@setup"]
math_delimiters = ["$", "$$", "\\(", "\\[", "```math"]

[ai_tells]
directory = "config/vale/styles/ai-tells"
severity = "advisory"
