[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "qa-toolkit"
version = "0.1.0.dev0"
description = "Repository-scoped personal quality toolkit"
requires-python = ">=3.11"
dependencies = [
  "pylatexenc==2.10",
  "tree-sitter==0.26.0",
  "tree-sitter-julia==0.23.1",
]

[dependency-groups]
qa = [
  "agent-slop-lint==1.0.3",
  "coverage[toml]==7.13.4",
  "grain-lint==0.3.1",
  "import-linter==2.13",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pydoclint==0.9.1",
  "pylint==4.0.6",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.10",
  "vulture==2.16",
]

[project.scripts]
qat = "qa_toolkit.dispatch:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["qa_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
