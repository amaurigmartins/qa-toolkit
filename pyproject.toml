[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "qa-toolkit"
version = "0.1.0.dev0"
description = "Repository-scoped personal quality toolkit"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
qat = "qa_toolkit.dispatch:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["qa_toolkit"]

