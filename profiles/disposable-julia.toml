schema_version = 1
name = "disposable-julia"
tools = [
  "gitleaks", "cocogitto", "shellcheck", "actionlint", "osv-scanner", "zizmor", "ast-grep",
  "trivy", "vale", "node", "cspell", "python", "grain", "slop", "julia-1.10.11",
  "julia-1.12.6", "juliaformatter", "aqua", "explicitimports",
]
configurations = []
skills = []
hooks = []


[[gates]]
id = "julia-source"
phase = "check"
argv = ["{qat-python}", "-m", "qa_toolkit.julia_source", "--target", "."]
triggers = ["**/*.jl"]
timeout = 120
severity = "blocking"
variants = []
finding_exit_codes = [1]
execution_error_exit_codes = [2]

[[gates]]
id = "julia-format-1.10.11"
phase = "check"
argv = ["{qat-python}", "-m", "qa_toolkit.julia_tools", "format", "--runtime", "1.10.11", "--target", "."]
triggers = ["**/*.jl", "**/.JuliaFormatter.toml"]
timeout = 300
severity = "blocking"
variants = ["1.10.11"]
finding_exit_codes = [1]
execution_error_exit_codes = [2]

