schema_version = 1
name = "qa-toolkit"
tools = [
  "uv", "gitleaks", "cocogitto", "jq", "yq", "prek", "fd", "ripgrep", "shellcheck",
  "actionlint", "osv-scanner", "zizmor", "ast-grep", "trivy", "vale", "rulesync", "gh",
  "node", "cspell", "python", "ruff", "mypy", "pytest", "coverage", "pytest-cov", "pylint",
  "vulture", "import-linter", "pydoclint", "grain", "slop", "pip-audit", "julia-1.10.11",
  "julia-1.12.6", "juliaformatter", "aqua", "explicitimports",
]
configurations = []
hooks = []
skills = []

[[gates]]
id = "python-format"
phase = "check"
argv = ["{tool:ruff}", "format", "--check", "src", "tests"]
triggers = ["**"]
timeout = 120
severity = "blocking"
variants = []
finding_exit_codes = [1]
execution_error_exit_codes = [2]

[[gates]]
id = "python-lint"
phase = "check"
argv = ["{tool:ruff}", "check", "src", "tests"]
triggers = ["**"]
timeout = 120
severity = "blocking"
variants = []
finding_exit_codes = [1]
execution_error_exit_codes = [2]

[[gates]]
id = "python-types"
phase = "check"
argv = ["{tool:mypy}"]
triggers = ["**"]
timeout = 180
severity = "blocking"
variants = []
finding_exit_codes = [1]
execution_error_exit_codes = [2]

[[gates]]
id = "python-tests"
phase = "sentinel"
argv = ["{tool:pytest}", "-p", "no:cacheprovider", "tests"]
triggers = ["**"]
timeout = 600
severity = "blocking"
variants = []
finding_exit_codes = [1]
execution_error_exit_codes = [2, 3, 4, 5]
